[package]
name = "tpt-nrg-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Python bindings for TPT Energy: power flow, dispatch, fault, LCOE, carbon, interop and SVG rendering"
categories = ["science", "api-bindings", "simulation"]
keywords = ["power-systems", "python", "energy", "power-flow", "matpower"]
# Built and published with maturin, not `cargo publish`.
publish = false

[lib]
# The importable Python module is `tpt_nrg` (see `pyproject.toml`'s
# `module-name`); the Rust library target keeps the crate name so the two do
# not collide with the `tpt-nrg` binary's rustdoc output.
name = "tpt_nrg_python"
crate-type = ["cdylib", "rlib"]

[lints.rust]
# pyo3's macros generate `unsafe` blocks internally.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[dependencies]
tpt-nrg-core = { workspace = true }
tpt-nrg-powerflow = { workspace = true }
tpt-nrg-fault = { workspace = true }
tpt-nrg-economic-dispatch = { workspace = true }
tpt-nrg-unit-commitment = { workspace = true }
tpt-nrg-lcoe = { workspace = true }
tpt-nrg-carbon = { workspace = true }
tpt-nrg-interop = { workspace = true }
tpt-nrg-viz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[dev-dependencies]
