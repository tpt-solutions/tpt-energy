[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tpt-nrg"
description = "Power-systems analysis for TPT Energy: power flow, dispatch, fault, LCOE, carbon, interop and SVG rendering"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "TPT Solutions" }]
keywords = ["power-systems", "power-flow", "energy", "matpower", "psse", "grid"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/tpt-solutions/tpt-energy"
Repository = "https://github.com/tpt-solutions/tpt-energy"
Documentation = "https://tpt-solutions.github.io/tpt-energy/"
Issues = "https://github.com/tpt-solutions/tpt-energy/issues"

[tool.maturin]
# The compiled module is `tpt_nrg`; the distribution is `tpt-nrg`.
module-name = "tpt_nrg"
features = ["pyo3/extension-module"]
strip = true
