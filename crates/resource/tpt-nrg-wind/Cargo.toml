[package]
name = "tpt-nrg-wind"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "TPT Energy wind power and wake models"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[dependencies]
tpt-nrg-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tpt-math-prob-dist = { workspace = true, optional = true }
tpt-math-prob-core = { workspace = true, optional = true }

[features]
substrate = ["dep:tpt-math-prob-dist", "dep:tpt-math-prob-core"]

[dev-dependencies]
approx = { workspace = true }
