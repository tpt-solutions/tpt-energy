[package]
name = "tpt-nrg-state-estimation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "TPT Energy Kalman-filter grid state estimator"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[dependencies]
tpt-nrg-core = { workspace = true }
tpt-nrg-topology = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tpt-math-signal-filter = { workspace = true, optional = true }

[features]
substrate = ["dep:tpt-math-signal-filter"]

[dev-dependencies]
approx = { workspace = true }
