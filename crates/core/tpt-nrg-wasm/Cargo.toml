[package]
name = "tpt-nrg-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "TPT Energy WebAssembly bindings for browser and edge control"
categories = ["science", "simulation", "wasm"]
keywords = ["power-systems", "wasm", "webassembly", "energy", "edge"]

# `cdylib` is what `wasm-pack` compiles; `rlib` keeps the crate usable from the
# rest of the workspace (and testable) in native builds.
[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[features]
# Default = native shim (no wasm-bindgen dependency). Enable the `wasm`
# feature when targeting `wasm32-unknown-unknown` for browser builds.
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
tpt-nrg-core = { workspace = true }
tpt-nrg-powerflow = { workspace = true }
tpt-nrg-der = { workspace = true }
tpt-nrg-economic-dispatch = { workspace = true }
tpt-nrg-unit-commitment = { workspace = true }
tpt-nrg-lcoe = { workspace = true }
tpt-nrg-carbon = { workspace = true }
tpt-nrg-viz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[dev-dependencies]

# The Rust compiler emits `memory.copy`/`memory.fill` (bulk-memory) and
# `i32.trunc_sat_f64_s`-style non-trapping float-to-int conversions by default
# for `wasm32-unknown-unknown`. `wasm-pack`'s bundled `wasm-opt` validates the
# module before optimizing it and rejects those instructions unless the
# features are explicitly enabled.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
