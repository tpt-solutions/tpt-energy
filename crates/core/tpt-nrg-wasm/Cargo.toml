[package]
name = "tpt-nrg-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "TPT Energy WebAssembly bindings for browser and edge control"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs = "warn"

[features]
# Default = native shim (no wasm-bindgen dependency). Enable the `wasm`
# feature when targeting `wasm32-unknown-unknown` for browser builds.
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
tpt-nrg-core = { workspace = true }
tpt-nrg-powerflow = { workspace = true }
tpt-nrg-der = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[dev-dependencies]
