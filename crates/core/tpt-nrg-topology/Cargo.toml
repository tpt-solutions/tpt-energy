[package]
name = "tpt-nrg-topology"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "TPT Energy network topology: graph, Y-bus, islands, shortest path"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[dependencies]
tpt-nrg-core = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tpt-math-linalg-sparse = { workspace = true, optional = true }

[features]
substrate = ["dep:tpt-math-linalg-sparse"]

[dev-dependencies]
approx = { workspace = true }
