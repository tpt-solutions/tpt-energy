[package]
name = "tpt-nrg-unit-commitment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "TPT Energy MILP unit commitment"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[dependencies]
tpt-nrg-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tpt-math-optimize-general = { workspace = true, optional = true }
tpt-math-optimize-convex = { workspace = true, optional = true }
tpt-math-linalg-dense = { workspace = true, optional = true }

[features]
substrate = [
    "dep:tpt-math-optimize-general",
    "dep:tpt-math-optimize-convex",
    "dep:tpt-math-linalg-dense",
]

[dev-dependencies]
approx = { workspace = true }
