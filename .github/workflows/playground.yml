name: Playground

# Builds the browser playground and publishes it to GitHub Pages. The page is
# static: a WebAssembly module, three test cases, and one script.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Build the WebAssembly package
        run: tools/build-npm-package.sh
      - name: Assemble the page
        run: |
          mkdir -p site/pkg site/cases
          cp playground/index.html playground/styles.css playground/app.js site/
          cp dist/npm/tpt_nrg_wasm.js \
             dist/npm/tpt_nrg_wasm.d.ts \
             dist/npm/tpt_nrg_wasm_bg.wasm \
             dist/npm/tpt_nrg_wasm_bg.wasm.d.ts \
             site/pkg/
          cp test-data/ieee/ieee14.json \
             test-data/ieee/ieee30.json \
             test-data/ieee/ieee57.json \
             site/cases/
      - name: Check the assembled page
        # The smoke test imports the same module the page does, so a renamed
        # export or a changed request shape fails here rather than in a
        # browser.
        run: |
          mkdir -p playground/pkg playground/cases
          cp site/pkg/* playground/pkg/
          cp site/cases/* playground/cases/
          node playground/tests/smoke.mjs
      - name: Configure Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
      - name: Upload the site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
