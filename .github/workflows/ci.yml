name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Run doc tests
        run: cargo test --workspace --all-features --doc

  examples:
    name: examples build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run examples sub-workspace
        # examples/ is its own cargo workspace, so `--workspace` above does
        # not compile it; do that explicitly here.
        run: |
          cargo check --manifest-path examples/Cargo.toml --all-targets
          cargo run --manifest-path examples/Cargo.toml --bin ieee-14-bus-powerflow

  golden-drift:
    name: golden fixture drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate golden fixtures
        run: |
          cargo run --manifest-path examples/Cargo.toml --bin generate-ieee-goldens
          cargo run --manifest-path examples/Cargo.toml --bin generate-solar-goldens
          cargo run --manifest-path examples/Cargo.toml --bin generate-wind-goldens
      - name: Fail on fixture drift
        # Generators round emitted values to 9 decimals so that libm ULP
        # differences across platforms cannot produce false positives.
        run: git diff --exit-code test-data

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate coverage
        run: cargo tarpaulin --workspace --out Xml --all-features
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
