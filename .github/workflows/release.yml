name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - tpt-nrg-core
          - tpt-nrg-topology
          - tpt-nrg-timeseries
          - tpt-nrg-solar
          - tpt-nrg-wind
          - tpt-nrg-hydro
          - tpt-nrg-load
          - tpt-nrg-powerflow
          - tpt-nrg-fault
          - tpt-nrg-state-estimation
          - tpt-nrg-protection
          - tpt-nrg-battery
          - tpt-nrg-hydrogen
          - tpt-nrg-thermal-storage
          - tpt-nrg-der
          - tpt-nrg-islanding
          - tpt-nrg-vpp
          - tpt-nrg-unit-commitment
          - tpt-nrg-economic-dispatch
          - tpt-nrg-reserve
          - tpt-nrg-lcoe
          - tpt-nrg-market
          - tpt-nrg-carbon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/core/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/resource/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/grid/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/storage/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/microgrid/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/dispatch/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/economics/${{ matrix.crate }}

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
