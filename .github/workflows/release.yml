name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  # Job-level `if:` cannot read `secrets`, so the tokens are lifted into the
  # environment here and the publishing jobs are gated on them. A repository
  # without a token skips the job instead of failing the whole release.
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require a registry token
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; add it as a repository secret" >&2
            exit 1
          fi
      - name: List the crates to publish
        # `cargo publish --workspace` publishes in dependency order, so the
        # manifest paths do not have to be hard-coded anywhere. Listing them
        # is for the release log: a crate that is silently skipped (because it
        # is `publish = false`, say) should be visible, not invisible.
        run: |
          tools/workspace-crates.py | tee publish-list.txt
          test -s publish-list.txt
      - name: Publish
        # `--no-verify` because every crate was built and tested by CI at the
        # tagged commit; the per-crate `cargo publish --dry-run` check in
        # ci.yml is what guards the packaging metadata.
        run: cargo publish --workspace --no-verify --allow-dirty

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: ${{ env.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and upload the wheel
        env:
          MATURIN_PYPI_TOKEN: ${{ env.PYPI_API_TOKEN }}
        run: |
          pip install maturin
          maturin publish \
            --manifest-path crates/bindings/tpt-nrg-python/Cargo.toml \
            --username __token__ \
            --password "$MATURIN_PYPI_TOKEN" \
            --out dist

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: ${{ env.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build the package
        run: tools/build-npm-package.sh
      - name: Publish
        run: npm publish dist/npm --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

  docker:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli-binaries:
    name: Prebuilt tpt-nrg binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tpt-nrg-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tpt-nrg-linux-aarch64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tpt-nrg-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tpt-nrg-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the CLI
        # `--locked` so a release is reproducible from the committed lockfile.
        run: cargo build --release --locked -p tpt-nrg-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/tpt-nrg.exe dist/
            (cd dist && zip "../${{ matrix.archive }}" tpt-nrg.exe)
          else
            cp target/${{ matrix.target }}/release/tpt-nrg dist/
            tar -C dist -czf ${{ matrix.archive }} tpt-nrg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tpt-nrg-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [publish, cli-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
