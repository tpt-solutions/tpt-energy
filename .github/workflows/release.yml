name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - tpt-nrg-core
          - tpt-nrg-topology
          - tpt-nrg-timeseries
          - tpt-nrg-solar
          - tpt-nrg-wind
          - tpt-nrg-hydro
          - tpt-nrg-load
          - tpt-nrg-powerflow
          - tpt-nrg-fault
          - tpt-nrg-state-estimation
          - tpt-nrg-protection
          - tpt-nrg-battery
          - tpt-nrg-hydrogen
          - tpt-nrg-thermal-storage
          - tpt-nrg-der
          - tpt-nrg-islanding
          - tpt-nrg-vpp
          - tpt-nrg-unit-commitment
          - tpt-nrg-economic-dispatch
          - tpt-nrg-reserve
          - tpt-nrg-lcoe
          - tpt-nrg-market
          - tpt-nrg-carbon
          - tpt-nrg-interop
          - tpt-nrg-viz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/core/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/resource/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/grid/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/storage/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/microgrid/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/dispatch/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/economics/${{ matrix.crate }}
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify --allow-dirty
        working-directory: crates/interop/${{ matrix.crate }}

  cli-binaries:
    name: Prebuilt tpt-nrg binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tpt-nrg-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tpt-nrg-linux-aarch64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tpt-nrg-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tpt-nrg-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the CLI
        # `--locked` so a release is reproducible from the committed lockfile.
        run: cargo build --release --locked -p tpt-nrg-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/tpt-nrg.exe dist/
            (cd dist && zip "../${{ matrix.archive }}" tpt-nrg.exe)
          else
            cp target/${{ matrix.target }}/release/tpt-nrg dist/
            tar -C dist -czf ${{ matrix.archive }} tpt-nrg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tpt-nrg-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [publish, cli-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
