# release-plz configuration.
#
# release-plz owns the *changelog and version bump*: on every push to the
# default branch it opens (or refreshes) a release PR that bumps every crate
# to the same version and rewrites the `CHANGELOG.md` files from the commits
# since the last tag.
#
# Publishing is deliberately NOT release-plz's job. `release.yml` publishes
# on a `v*.*.*` tag, which keeps a human in the loop between "the code is
# ready" and "the artifacts are public", and keeps one place responsible for
# crates.io, PyPI, npm, the container image, and the GitHub release. The
# workflow therefore only ever runs `release-plz release --pr`, and a
# maintainer pushes the tag once that PR is merged.
#
# Schema: release-plz 1.x. Field names are validated against
# https://raw.githubusercontent.com/release-plz/release-plz/main/.schema/latest.json
# (additionalProperties is false, so an unknown field fails the whole config).

[workspace]
# Both the workspace-level and the per-crate changelogs are updated.
changelog_update = true
# Do not tag or create a GitHub release: `release.yml` owns both.
git_release_enable = false
git_tag_name = "v{{version}}"
